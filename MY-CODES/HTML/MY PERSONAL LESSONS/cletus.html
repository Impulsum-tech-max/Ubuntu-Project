<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="login page for users">
    <title>Login</title>
    <link rel="stylesheet" href="css/mystyle.css">

    <style>
        body {
            min-height: 100vh;
            background-image: url("/MY-CODES/IMAGES/reddishblack.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .logo{
            background-color: white;
            width: 40px;
            height: 40px;
            text-align: center;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo img{
            margin: 0 auto ;
            height: 80%;
            width: 80%;
        }

        .container{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1, p{
            color: whitesmoke;
        }

        fieldset {
            border: 2px solid white;
            border-radius: 32px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            padding: 50px 62px;
            box-sizing: border-box;
        }

        .forgot {
            display: flex;
            justify-content: center;
            color: lightblue;
            margin-top: 10px;
        }

        .forgot:hover{
            color: beige;
        }

        input {
            font-size: 15px;
            background-color: beige;
            border-radius: 10px;
            width: 200px;
            padding: 5px 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 35px;
            margin-bottom: 5px;
        }

        .button {
            display: inline-block;
            width: 120px;
            padding: 5px;
            border-radius: 50px;
            color: black;
            background-color: beige;
            font-size:18px;
            font-weight: bold;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif, Helvetica, sans-serif;
            text-decoration: none;
            margin-top: 25px;
            box-sizing: border-box;
        }

        .button:hover{
            font-weight: bolder;
            text-shadow: 0 0 10px beige,
                         0 0 20px beige,
                         0 0 30px beige,
                         0 0 40px beige;
        }

        .sign-in {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .link{
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            margin-left: 15px;
            background-color: whitesmoke;
            border-radius: 15px;
        }

        .social-logo{
            width: 30px;
            height: 30px;
        }

        .social-logo:hover{
            transform: scale(1.25);
            transition: 0.25s;
        }

    </style>
</head>

<body>
    <div class="container">

        <form action="">
        <fieldset>
            <div class="logo">
                <img src="/MY-CODES/IMAGES/login.png" alt="Login">
            </div>
            
            <h1>Welcome Back 😀</h1>

            <p>Sign in to your account</p>
            <p>Make a new doc to bring your works, data, and teams together.</p>
            <p> It's free!</p>

                     <!-- login details -->
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Email Address" required><br>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Password" required><br>

                        <!-- forgot password section -->
            <br><div>
                <a href="forgot password.html" target="_blank" rel="noopener noreferrer" class="forgot">Forgot password?</a>
            </div>

            <!-- To next page -->
            <a href="New page.html" class="button">Get Started</a>

            <div class="sign-in">
                
                <p>Or sign in with</p>
                
            </div>

            <div>
                
                        <a href="#" class="link">
                            <img src="/MY-CODES/IMAGES/google.png" alt="Google" class="social-logo">
                        </a>
        
                
                
                        <a href="#" class="link">
                            <img src="/MY-CODES/IMAGES/facebook.png"  class="social-logo" alt="Facebook">
                        </a>
                    

                
                    
                        <a href="#"  class="link">
                            <img src="/MY-CODES/IMAGES/apple-brands-solid-full.svg" alt="iOS" class="social-logo">
                        </a>
                    
                
            </div>

            <div>
                <p>
                    🔒 Your data is secure and encrypted
                </p>
            </div>
        </fieldset>
    </form>

    </div>
</body>

</html>
