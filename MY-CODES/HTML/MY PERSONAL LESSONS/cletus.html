<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/mystyle.css">
    <style>
        body {
            min-height: 100vh;
            background-image: url("/MY-CODES/IMAGES/reddishblack.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
            text-align: center;
        }

        .logo{
            background-color: white;
            width: 40px;
            text-align: center;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo img{
            /* top: 0; */
            margin: 0 auto ;
            height: 50%;
            width: 50%;
        }

        .container{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1, p{
            color: whitesmoke;
        }

        fieldset {
            border: 2px solid white;
            border-radius: 32px;
            text-align: center;
            width: 90%;
            padding: 50px 62px;
        }

        .forgot {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 0px;
        }


        input {
            font-size: 15px;
            background-color: beige;
            border-radius: 10px;
            padding: 0px 15px;
            height: 25%;
            margin-top: 22px;
        }

        h1 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 50px;
            margin-bottom: 5px;
        }

        .get-started {
            width: 120px;
            /* height: 50px; */
            border-radius: 50px;
            color: black;
            background-color: beige;
            font-size: 2opx;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            text-decoration: none;
        }

        .get-started:hover{
            font-weight: bolder;
            text-shadow: 0 0 10px beige,
                         0 0 20px beige,
                         0 0 30px beige,
                         0 0 40px beige;
        }

        .sign-in {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }

        .social {
            width: 100px;
            /* height: 50px; */
            border: 2px solid black;
            border-radius: 10px;
            background-color: beige;
            font-size: large;
            font-weight: bold;
            margin-left: 10px;
        }

        .social:hover{
            font-weight: bolder;
            text-shadow: 0 0 10px burlywood,
                         0 0 20px burlywood,
                         0 0 30px burlywood,
                         0 0 40px burlywood;
            
        }

        .link{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            text-decoration: none;
            color: black;
        }

        .social-logo{
            width: 50%;
            height: 50%;
        }

        .social-logo:hover{
            font-size: larger;
            text-shadow: 0 0 10px black,
                         0 0 20px black,
                         0 0 30px black,
                         0 0 40px black;
            
        }

    </style>
</head>

<body>
    <div class="container">

        <form action="">
        <fieldset>
            <div class="logo">
                <img src="/MY-CODES/IMAGES/login.png" alt="Login">
            </div>
            
            <h1>Welcome back 😀</h1>

            <p>Sign in to your account</p>
            <p>Make a new doc to bring your works, data, and teams together.</p>
            <p> It's free!</p>

                     <!-- login details -->
            <label for="Email">Email</label>
            <input type="email" name="Email" placeholder="Email Address" required><br>
            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Password" required><br>

                        <!-- forgot password section -->
            <div class="forgot">
                <a href="forgot password.html">Forgot password?</a><br>
            </div>

            <!-- For submission -->
             <br>
            <a href="New page.html" class="get-started">Get Started</a>

            <div class="sign-in">
                
                <p class="sign-in">Or sign in with</p>
                
            </div>

            <div>
                <button type="button" class="social">
                    <strong class="google">
                        <a href="https://accounts.google.com" target="_blank" class="link">
                            <img src="/MY-CODES/IMAGES/google.png" alt="Google" class="social-logo">
                        </a>
                    </strong>
                </button>
                <button type="button" class="social">
                    <strong class="facebook">
                        <a href="https://www.facebook.com/login" class="link" target="_blank">
                            <img src="/MY-CODES/IMAGES/facebook.png"  class="social-logo" alt="Facebook">
                        </a>
                    </strong>
                </button>
                <button type="button" class="social">
                    <strong class="apple">
                        <a href="https://appleid.apple.com"  class="link" target="_blank">
                            <img src="/MY-CODES/IMAGES/apple-brands-solid-full.svg" alt="iOS" class="social-logo">
                        </a>
                    </strong>
                </button>
            </div>

            <div>
                <p>
                    🔒 Your data is secure and encrypted
                </p>
            </div>
        </fieldset>
    </form>

    </div>
</body>

</html>
