<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>restaurant demo</title>

    <link rel="stylesheet" href="/MY-CODES/CSS/SIWES TRAINING/restaurant.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=location_on,menu,local_shipping,shopping_bag">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="/MY-CODES/IMAGES/crunchies.png" alt="Crunchhies Logo">

                <div class="location-icon">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <p>Set location</p>
                </div>
            </div>

            <nav>
                <ul>
                    <li><a href="#" class="nav">Home</a></li>
                    <li><a href="#" class="nav">Menu</a></li>
                    <li><a href="#" class="nav">My Account</a></li>
                    <li><a href="#" class="nav">Support</a></li>
                </ul>
            </nav>
            <div class="cart">
                <img src="/MY-CODES/IMAGES/cart.png" alt="Cart">

                <span class="material-symbols-outlined hamburger-menu">
                    menu
                </span>
            </div>
        </header>
    

    <div class="main">
        <main>
            <div class="text">
                <h1>Welcome to <br>
                    <span class="crunchies">CRUNCHIES</span>
                </h1>
                <p>...taste the difference</p>
                <p id="question">How would you like to receive your order?</p>

                <button type="button" id="delivery">
                    <span class="material-symbols-outlined">
                        local_shipping
                    </span>
                    Delivery</button> <br>    
                <button type="button" id="pickup">
                    <span class="material-symbols-outlined">
                        shopping_bag
                    </span>
                    Pickup</button>
            </div>

            <div class="image">
                <img src="/MY-CODES/IMAGES/blackwomanwithburger.png" alt="">
            </div>
        </main>
    </div>

    <div class="menu-section">
            <section id="menu">
                <div id="title">
                    <h2>Our Menu</h2>
                </div>

                <figcaption> 
                    <img src="/MY-CODES/IMAGES/donut.jpeg" alt="A donut">
                </figcaption>
                <figcaption>
                    <img src="/MY-CODES/IMAGES/hamburger.jpeg" alt="A hamburger">
                </figcaption>
                <figcaption>
                    <img src="/MY-CODES/IMAGES/jollofrice.jpeg" alt="A plate of jollof rice">
                </figcaption>
                <figcaption>
                    <img src="/MY-CODES/IMAGES/meatpie.jpeg" alt="meatpie">
                </figcaption>

            </section>

        </div>
       <button type="button" id="menu-button">See More</button> 
    

       <section id="about-us">
                <h2>About Us</h2>
            </section>
    </div>
</body>

</html>
