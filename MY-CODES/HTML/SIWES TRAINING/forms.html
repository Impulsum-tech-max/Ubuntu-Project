<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <div>
        <form action="#" method="get">
            Firstname: <input type="text" name="firstname" id="firstname"  placeholder="john"> <br><br>
            Lastname: <input type="text" name="lastname" id="lastname" placeholder="doe"> <br><br>
            LGA: <input type="text" name="localGovernmentArea" id="lga" placeholder="Enter your local government"> <br><br>
            <p>Gender</p>
            Male <input type="radio" name="male" id="male" value="male">
            Female <input type="radio" name="female" id="female" value="female">
            Male <input type="radio" name="other" id="other" value="other"> <br><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
