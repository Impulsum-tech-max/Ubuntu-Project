<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="container">
        <h1>MY TASKS</h1>
        <div class="tasks">
            <input type="text" name="taskInput" id="taskInput">
            <button type="button" id="addBtn">Add Task</button>
        </div>

        <div class="button-menu">
            <button type="button" id="filterAll">All</button>
            <button type="button" id="filterPending">Pending</button>
            <button type="button" id="filterCompleted">Completed</button>
        </div>

        <div id="taskList">

        </div>
        <footer>
    <h2>TASK MANAGER</h2>

    <p>Organise your tasks. Own your time.</p>

    <p class="tech-stack">
        Built with HTML · CSS · JavaScript
    </p>

    <p class="copyright">
        &copy; 2026 — All rights reserved.
    </p>
</footer>
    <div class="date"></div>
    </div>
    
</body>
</html>
